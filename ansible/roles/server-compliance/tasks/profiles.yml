---
- name: Download and extract compliance profiles
  block:
    - name: Download profile tarball — {{ item.name }}
      ansible.builtin.get_url:
        url: "{{ item.repo }}"
        dest: "/tmp/{{ item.name }}.tar.gz"
        checksum: "{{ item.checksum }}"
        mode: "0644"
      loop: "{{ _enabled_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Extract profile — {{ item.name }}
      ansible.builtin.unarchive:
        src: "/tmp/{{ item.name }}.tar.gz"
        dest: "{{ audit_profiles_base }}"
        remote_src: true
        creates: "{{ audit_profiles_base }}/{{ item.extracted_dir }}"
      loop: "{{ _enabled_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Symlink profile directory to canonical name — {{ item.name }}
      ansible.builtin.file:
        src: "{{ audit_profiles_base }}/{{ item.extracted_dir }}"
        dest: "{{ audit_profiles_base }}/{{ item.name }}"
        state: link
        force: true
      loop: "{{ _enabled_profiles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove downloaded tarballs
      ansible.builtin.file:
        path: "/tmp/{{ item.name }}.tar.gz"
        state: absent
      loop: "{{ _enabled_profiles }}"
      loop_control:
        label: "{{ item.name }}"

- name: Deploy waivers (only for profiles with a waivers.yaml)
  ansible.builtin.copy:
    src: "{{ compliance_waivers_dir }}/{{ item.name }}/waivers.yaml"
    dest: "{{ audit_profiles_base }}/{{ item.name }}/waivers.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _enabled_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: (compliance_waivers_dir ~ '/' ~ item.name ~ '/waivers.yaml') is file

- name: Deploy profile inputs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compliance-profiles/{{ item.name }}/inputs.yaml"
    dest: "{{ audit_profiles_base }}/{{ item.name }}/inputs.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _enabled_profiles | selectattr('has_inputs') | list }}"
  loop_control:
    label: "{{ item.name }}"
