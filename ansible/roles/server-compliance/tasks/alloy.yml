---
# apt.grafana.com serves an ASCII-armored key; a keyring referenced by
# signed-by=*.gpg must be binary, so dearmor it.
- name: Download Grafana APT signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
  register: _grafana_key

- name: Dearmor Grafana APT signing key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /etc/apt/keyrings/grafana.gpg /etc/apt/keyrings/grafana.asc
  when: _grafana_key is changed
  changed_when: true

- name: Set Grafana keyring permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/grafana.gpg
    mode: "0644"

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0640"
  notify: Restart alloy

- name: Deploy Alloy environment file (credentials)
  ansible.builtin.template:
    src: alloy_defaults.j2
    dest: /etc/default/alloy
    owner: root
    group: root
    mode: "0600"
  notify: Restart alloy

- name: Enable and start Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
