# Loki recording rules that derive Prometheus metrics from compliance JSON logs.
#
# These rules run server-side in Grafana Cloud Loki and write their results
# as Prometheus metrics. They replace the local textfile collector approach.
#
# Deploy with: ./deploy-recording-rules.sh
#
# Windows (2026-11-18): CIS runs once a day (02:00-05:00 host time, staggered per host),
# CVE profiles every 3 h, and linux-baseline is no longer scheduled. last_over_time windows
# must exceed the longest gap between two scans of a profile on a host (24 h + scan-duration
# drift + 1 h on the DST fall-back day), or the metrics drop out between scans: 26h.
# cinc_auditor_last_scan_timestamp_seconds keeps 7d so ComplianceScanStale (> 26 h) still
# has a series to fire on after scans stop. The line filters skip json parsing of
# non-matching lines, which keeps the longer windows cheap.

groups:
  - name: compliance-per-control-linux-baseline
    interval: 5m
    rules:
      # Per-control failed status for linux-baseline.
      # Filtered to failed-only to stay under Loki's 500 series limit
      # (~15 failing controls × 10 hosts = ~150 series).
      - record: cinc_auditor_control_status
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              | json
              | type="control"
              | profile="linux-baseline"
              | status="failed"
              | unwrap status_val [2h]
          ) by (host, profile, control, severity)

  - name: compliance-per-control-cis-dil-benchmark
    interval: 5m
    rules:
      # Per-control failed status for cis-dil-benchmark. A control fixed since its last failing
      # scan drops out when that line leaves the 26h window (~2 h after the next daily scan).
      # Filtered to failed-only to stay under Loki's 500 series limit
      # (~60 failing controls × 10 hosts = ~600 max, shrinks as waivers apply).
      - record: cinc_auditor_control_status
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"status\":\"failed\""
              | json
              | type="control"
              | profile="cis-dil-benchmark"
              | status="failed"
              | unwrap status_val [26h]
          ) by (host, profile, control, severity)

  - name: compliance-aggregates
    interval: 5m
    rules:
      # Compliance score (0.0–1.0, excluding waived/skipped)
      - record: cinc_auditor_compliance_score
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap score [26h]
          ) by (host, profile)

      # Control counts by status
      - record: cinc_auditor_controls_total
        labels:
          status: passed
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap passed [26h]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: failed
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap failed [26h]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: waived
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap waived [26h]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: skipped
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap skipped [26h]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: total
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap total [26h]
          ) by (host, profile)

      # Scan duration in seconds
      - record: cinc_auditor_scan_duration_seconds
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap duration [26h]
          ) by (host, profile)

      # Unix timestamp of the last completed scan (7d window: see header)
      - record: cinc_auditor_last_scan_timestamp_seconds
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap scan_ts [7d]
          ) by (host, profile)
