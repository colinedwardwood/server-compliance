# Loki recording rules that derive Prometheus metrics from compliance JSON logs.
#
# These rules run server-side in Grafana Cloud Loki and write their results
# as Prometheus metrics. They replace the local textfile collector approach.
#
# Deploy with: ./scripts/deploy-recording-rules.sh
#
# ${COMPLIANCE_WINDOW} is substituted at deploy time (from .env; default 13h).
# Every last_over_time window must be longer than the longest interval between two
# scans of the same profile on a host, or the metrics disappear between scans:
#   - shipped schedule (linux-baseline hourly, cis-dil-benchmark every 6 h): 13h
#   - daily scans: 26h (24 h + scan duration + the extra hour on a DST change)
# Trade-off: a control that was failing and is fixed keeps its failed series until
# its last failing line leaves the window.
#
# cinc_auditor_last_scan_timestamp_seconds uses a fixed 7d window so that
# ComplianceScanStale still has a series to fire on after scans stop. After 7 days
# without any scan the series disappears and the alert resolves.
#
# The |= line filters skip JSON parsing of lines that can't match, which keeps the
# longer windows cheap.

groups:
  - name: compliance-per-control-linux-baseline
    interval: 5m
    rules:
      # Per-control failed status for linux-baseline.
      # Filtered to failed-only to stay under Loki's 500 series limit
      # (~15 failing controls × 10 hosts = ~150 series).
      - record: cinc_auditor_control_status
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"status\":\"failed\""
              | json
              | type="control"
              | profile="linux-baseline"
              | status="failed"
              | unwrap status_val [${COMPLIANCE_WINDOW}]
          ) by (host, profile, control, severity)

  - name: compliance-per-control-cis-dil-benchmark
    interval: 5m
    rules:
      # Per-control failed status for cis-dil-benchmark.
      # Filtered to failed-only to stay under Loki's 500 series limit
      # (~60 failing controls × 10 hosts = ~600 max, shrinks as waivers apply).
      - record: cinc_auditor_control_status
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"status\":\"failed\""
              | json
              | type="control"
              | profile="cis-dil-benchmark"
              | status="failed"
              | unwrap status_val [${COMPLIANCE_WINDOW}]
          ) by (host, profile, control, severity)

  - name: compliance-aggregates
    interval: 5m
    rules:
      # Compliance score (0.0–1.0, excluding waived/skipped)
      - record: cinc_auditor_compliance_score
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap score [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      # Control counts by status
      - record: cinc_auditor_controls_total
        labels:
          status: passed
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap passed [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: failed
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap failed [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: waived
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap waived [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: skipped
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap skipped [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      - record: cinc_auditor_controls_total
        labels:
          status: total
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap total [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      # Scan duration in seconds
      - record: cinc_auditor_scan_duration_seconds
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap duration [${COMPLIANCE_WINDOW}]
          ) by (host, profile)

      # Unix timestamp of the last completed scan (fixed 7d window; see header)
      - record: cinc_auditor_last_scan_timestamp_seconds
        expr: |
          last_over_time(
            {job="custom/cinc_auditor"}
              |= "\"type\":\"scan_summary\""
              | json
              | type="scan_summary"
              | unwrap scan_ts [7d]
          ) by (host, profile)
