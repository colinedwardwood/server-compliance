# cinc-auditor / InSpec waiver file for dev-sec/linux-baseline
#
# !! HOST-SPECIFIC — review before deploying to other machines !!
# The entries below reflect common real-world scenarios (older hardware,
# Tailscale VPN, home-lab media servers). Remove or update any entry that
# does not apply to the target system.
#
# Format:
#   <control-id>:
#     expiration_date: YYYY-MM-DD   # waiver auto-expires; remove if no longer valid
#     justification: <text>
#     run: false   # skip entirely | run: true = run but don't count as failure
#
# Review quarterly; remove waivers that no longer apply.

# ── CPU vulnerability mitigations (os-12) ────────────────────────────────────
# Older hardware (Sandy Bridge era and similar) has partial Spectre/Meltdown
# mitigations in the kernel, but /sys/devices/system/cpu/vulnerabilities/ may
# still report some entries as "Vulnerable" — this is a hardware limitation,
# not a configuration failure.
os-12:
  expiration_date: "2027-01-01"
  justification: "Legacy hardware has known Spectre/Meltdown limitations; kernel mitigations applied where supported."
  run: true

# ── Mount options: noexec / nosuid / nodev (os-14, os-15, os-16) ─────────────
# These controls require noexec/nosuid/nodev on all mountpoints.
# Hosts with user home directories or media mounts need exec bits for
# user scripts and legitimate tools.
os-14:
  expiration_date: "2027-01-01"
  justification: "/home requires exec for user scripts and audit tooling."
  run: true

os-15:
  expiration_date: "2027-01-01"
  justification: "Some mounts require suid bits for legitimate system tools (su, ping, etc.)."
  run: true

os-16:
  expiration_date: "2027-01-01"
  justification: "Some mounts serve device files required by hardware peripherals."
  run: true

# ── IPv4 forwarding (sysctl-01) ───────────────────────────────────────────────
# Tailscale requires net.ipv4.ip_forward=1 to route traffic between the
# Tailscale interface and the LAN. Without this, the VPN does not function.
sysctl-01:
  expiration_date: "2027-01-01"
  justification: "Tailscale VPN requires IPv4 forwarding; managed and firewalled by Tailscale and ufw."
  run: true

# ── IPv6 router solicitations (sysctl-21) ────────────────────────────────────
# Tailscale manages its own IPv6 stack and requires router solicitations
# to discover routers on the Tailscale network interface.
sysctl-21:
  expiration_date: "2027-01-01"
  justification: "Tailscale requires IPv6 router solicitations on its own interface; disabling breaks VPN connectivity."
  run: true

# ── IPv6 autoconfiguration (sysctl-26) ───────────────────────────────────────
# Same rationale as sysctl-21; Tailscale relies on SLAAC for its IPv6 addresses.
sysctl-26:
  expiration_date: "2027-01-01"
  justification: "Tailscale uses IPv6 SLAAC for address assignment; disabling breaks VPN IPv6 connectivity."
  run: true
